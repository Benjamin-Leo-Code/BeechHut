configuration:
  title:
    name: Title
    description: Shown at the top of the console.
  subtitle:
    name: Subtitle
  unraid_url:
    name: Unraid address
    description: How Home Assistant reaches Unraid, e.g. http://192.168.1.10
  unraid_api_key:
    name: Unraid API key
    description: Unraid → Settings → Management Access → API Keys (admin role, or read access plus Docker and VM control).
  unraid_web_url:
    name: Unraid link
    description: Optional address to open when you click through to Unraid, e.g. http://tower.local
  unraid_host_address:
    name: Container link address
    description: Optional. Address used to build container web UI links. Defaults to the host in the Unraid address.
  favourite_containers:
    name: Favourite containers
    description: Container names to show first in the apps bar at the top of the overview.
  hidden_containers:
    name: Hidden containers
    description: Container names to leave out entirely.
  ha_vm_name:
    name: Home Assistant VM name
    description: The name of this VM in Unraid.
  unifi_url:
    name: UniFi address
    description: Your UniFi gateway or console, e.g. https://192.168.1.1
  unifi_api_key:
    name: UniFi API key
    description: UniFi Network → Settings → Control Plane → Integrations.
  unifi_site:
    name: UniFi site
  unifi_api_base:
    name: UniFi API path
    description: Only needed for a self-hosted UniFi Network Application.
  low_battery:
    name: Low battery threshold (%)
  hidden_entities:
    name: Hidden entities
    description: Entity IDs to ignore. End with * to match a prefix, e.g. sensor.sun_*
  house_plan_url:
    name: House plan address
    description: Where the house plan folder (plan.json and its scans) is served from, e.g. /local/my-folder/house-plan/ for a folder in Home Assistant's www folder. Leave blank to hide the plan.
  photo_frame_folder:
    name: Photo frame folder
    description: The folder in Home Assistant's config folder that the photo frame shows, e.g. /config/www/photo-frame. Photo uploader adds photos here. Leave blank to hide Photo uploader.
  photo_frame_shape:
    name: Photo frame shape
    description: The frame's width:height, e.g. 16:9. Photos are cropped to this shape. Leave blank for 238:162.
  frame_tv_address:
    name: Frame TV address
    description: The IP address of your Samsung The Frame TV (reserve it in your router so it doesn't change). Photo uploader can then add photos to its Art Mode. Leave blank if you don't have one.
  frame_tv_matte:
    name: Frame TV mat
    description: The mat (border) Art Mode puts round uploaded photos, as Samsung names it, e.g. shadowbox_polar or modern_apricot. Leave blank for none.
  links:
    name: Links
    description: Bookmarks. Icon is a name from dashboardicons.com (e.g. plex) or an image URL. Pinned links go in Quick launch.
