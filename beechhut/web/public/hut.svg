<!-- The hut on its own, for inside the dashboard. icon.svg (with the green tile) is the app/tab icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 4.9 52 52">
  <defs>
    <!-- Weatherboard stripes for the walls and gable -->
    <pattern id="boards" width="4" height="5" patternUnits="userSpaceOnUse" y="0.5">
      <rect width="4" height="2.5" fill="#f6faf3"/>
      <rect y="2.5" width="4" height="2.5" fill="#9cc98e"/>
    </pattern>
    <!-- Vertical planks for the doors -->
    <pattern id="planks" width="4.8" height="4" patternUnits="userSpaceOnUse" x="20">
      <rect width="2.4" height="4" fill="#9cc98e"/>
      <rect x="2.4" width="2.4" height="4" fill="#f6faf3"/>
    </pattern>
  </defs>
  <!-- Hut body: walls + gable in one striped shape -->
  <path d="M12 54V25l20-14.12L52 25v29Z" fill="url(#boards)" stroke="#1e4027" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Corner posts -->
  <path d="M12.75 25v29M51.25 25v29" stroke="#f6faf3" stroke-width="1.5"/>
  <!-- Double doors -->
  <rect x="20" y="24.3" width="24" height="29.7" fill="url(#planks)"/>
  <path d="M20 54V24.3h24V54M32 24.3V54" fill="none" stroke="#1e4027" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Small strap hinges on the outer edges -->
  <path d="M19 29.4h4.6M19 48.3h4.6M45 29.4h-4.6M45 48.3h-4.6" stroke="#1e4027" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Sliding bolt: short lock on the left door, longer catch on the right -->
  <g transform="translate(32 38.9) scale(0.9) translate(-32 -38.9)">
    <rect x="31" y="38.6" width="2" height="0.7" fill="#1e4027"/>
    <rect x="29.35" y="37.8" width="1.65" height="2.2" rx="0.3" fill="#1e4027"/>
    <rect x="33" y="37.8" width="4.4" height="2.2" rx="0.3" fill="#1e4027"/>
  </g>
  <!-- Roof: square-cut boards, small overhang, outlined -->
  <path d="M9.88 26.5 32 10.88 54.12 26.5l2.08-2.94L32 6.47 7.8 23.56Z" fill="#f6faf3" stroke="#1e4027" stroke-width="1.2" stroke-linejoin="miter"/>
  <!-- Base -->
  <rect x="10" y="53" width="44" height="3.4" rx="0.8" fill="#1e4027"/>
</svg>
